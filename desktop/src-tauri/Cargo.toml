[package]
name = "smartcaja"
version = "2.0.0"
description = "SmartCaja — gestión de flujo de caja inteligente con IA local para PYMEs, de la Cámara de Comercio de Santiago."
authors = ["Cámara de Comercio de Santiago"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", default-features = false }

[[bin]]
name = "smartcaja"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
